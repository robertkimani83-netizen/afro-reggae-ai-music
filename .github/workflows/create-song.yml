name: Create Afro-Reggae Song

on:
  workflow_dispatch:
    inputs:
      song_title:
        description: 'Song title (a starting idea - Gemini can improve it)'
        required: true
        default: 'Sweet Island Loving'
        type: string
      theme:
        description: 'Song theme/story'
        required: true
        default: 'Romantic island love under the African sunset'
        type: string
      mood:
        description: 'Mood'
        required: true
        default: 'Romantic, warm, uplifting'
        type: string
      language:
        description: 'Language (English only for now - see README)'
        required: true
        default: 'English'
        type: string
      video_style:
        description: 'Music-video visual style (used as a Pexels photo search hint)'
        required: true
        default: 'African tropical island, cinematic, romantic, realistic'
        type: string
      duration:
        description: 'Roughly how many minutes the song should be (a guide for how many verse/chorus sections to write, 1-6 min -- not an exact guarantee)'
        required: true
        default: '2'
        type: string
      upload_youtube:
        description: 'Upload to YouTube after generation'
        required: true
        default: false
        type: boolean
      youtube_privacy:
        description: 'YouTube visibility'
        required: true
        default: 'private'
        type: choice
        options:
          - private
          - unlisted
          - public

jobs:
  generate:
    # Sept 15 2026: switched from windows-latest + a local ACE-Step install
    # to plain ubuntu-latest. The actual singing/music generation now runs
    # on Hugging Face's free hosted infrastructure (see generate_music.py),
    # so this runner never needs to do heavy AI compute itself -- it's just
    # calling APIs and running ffmpeg, exactly like next-scene-news's
    # runners. This is also cheaper on your free GitHub Actions minutes:
    # Windows runners count double against the free monthly quota, Linux
    # runners count 1x.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read

    env:
      SONG_TITLE: ${{ inputs.song_title }}
      SONG_THEME: ${{ inputs.theme }}
      SONG_MOOD: ${{ inputs.mood }}
      SONG_LANGUAGE: ${{ inputs.language }}
      VIDEO_STYLE: ${{ inputs.video_style }}
      SONG_DURATION_MIN: ${{ inputs.duration }}
      YOUTUBE_UPLOAD: ${{ inputs.upload_youtube }}
      YOUTUBE_PRIVACY: ${{ inputs.youtube_privacy }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install pipeline Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate lyrics and metadata
        run: python scripts/generate_metadata.py

      - name: Generate full sung song (YuE2-3B, free HF Space)
        run: python scripts/generate_music.py

      - name: Fetch real photos for music-video scenes
        run: python scripts/generate_scenes.py

      - name: Assemble music video
        run: python scripts/assemble_video.py

      - name: Generate thumbnail
        run: python scripts/generate_thumbnail.py

      - name: Upload to YouTube
        if: ${{ inputs.upload_youtube }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/upload_youtube.py

      - name: Publish generated files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: afro-reggae-${{ inputs.song_title }}
          path: output/
          if-no-files-found: error
          retention-days: 7
