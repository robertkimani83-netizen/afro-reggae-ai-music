name: Create Afro-Reggae Song

on:
  workflow_dispatch:
    inputs:
      song_title:
        description: 'Song title'
        required: true
        default: 'Sweet Island Loving'
        type: string
      theme:
        description: 'Song theme/story'
        required: true
        default: 'Romantic island love under the African sunset'
        type: string
      mood:
        description: 'Mood'
        required: true
        default: 'Romantic, warm, uplifting'
        type: string
      language:
        description: 'Language'
        required: true
        default: 'English + Swahili'
        type: string
      video_style:
        description: 'AI video visual style'
        required: true
        default: 'African tropical island, cinematic, romantic, realistic'
        type: string
      duration:
        description: 'Target duration in minutes (free online ACE-Step is capped at about 2 minutes per generation)'
        required: true
        default: '2'
        type: string
      upload_youtube:
        description: 'Upload to YouTube after generation'
        required: true
        default: false
        type: boolean
      youtube_privacy:
        description: 'YouTube visibility'
        required: true
        default: 'private'
        type: choice
        options:
          - private
          - unlisted
          - public

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read

    env:
      SONG_TITLE: ${{ inputs.song_title }}
      SONG_THEME: ${{ inputs.theme }}
      SONG_MOOD: ${{ inputs.mood }}
      SONG_LANGUAGE: ${{ inputs.language }}
      VIDEO_STYLE: ${{ inputs.video_style }}
      SONG_DURATION_MIN: ${{ inputs.duration }}
      YOUTUBE_UPLOAD: ${{ inputs.upload_youtube }}
      YOUTUBE_PRIVACY: ${{ inputs.youtube_privacy }}
      ACE_STEP_SPACE: ACE-Step/Ace-Step-v1.5
      ACE_STEP_MAX_SECONDS: '110'
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 --version
          ffmpeg -version | head -n 1

      - name: Create Python environment
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate lyrics and metadata
        run: |
          . .venv/bin/activate
          python scripts/generate_metadata.py

      - name: Generate full song with official online ACE-Step 1.5
        run: |
          . .venv/bin/activate
          python scripts/generate_music.py

      - name: Generate music-video scenes
        run: |
          . .venv/bin/activate
          python scripts/generate_scenes.py

      - name: Assemble music video
        run: |
          . .venv/bin/activate
          python scripts/assemble_video.py

      - name: Generate thumbnail
        run: |
          . .venv/bin/activate
          python scripts/generate_thumbnail.py

      - name: Upload to YouTube
        if: ${{ inputs.upload_youtube }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          . .venv/bin/activate
          python scripts/upload_youtube.py

      - name: Publish generated files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: afro-reggae-${{ inputs.song_title }}
          path: output/
          if-no-files-found: error
          retention-days: 7
