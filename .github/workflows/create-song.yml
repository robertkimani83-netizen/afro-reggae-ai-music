name: Create Afro-Reggae Song

on:
  workflow_dispatch:
    inputs:
      song_title:
        description: 'Song title'
        required: true
        default: 'Sweet Island Loving'
        type: string
      theme:
        description: 'Song theme/story'
        required: true
        default: 'Romantic island love under the African sunset'
        type: string
      mood:
        description: 'Mood'
        required: true
        default: 'Romantic, warm, uplifting'
        type: string
      language:
        description: 'Language'
        required: true
        default: 'English + Swahili'
        type: string
      video_style:
        description: 'AI video visual style'
        required: true
        default: 'African tropical island, cinematic, romantic, realistic'
        type: string
      duration:
        description: 'Target duration in minutes'
        required: true
        default: '3'
        type: string
      upload_youtube:
        description: 'Upload to YouTube after generation'
        required: true
        default: false
        type: boolean
      youtube_privacy:
        description: 'YouTube visibility'
        required: true
        default: 'private'
        type: choice
        options:
          - private
          - unlisted
          - public

jobs:
  generate:
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read

    env:
      SONG_TITLE: ${{ inputs.song_title }}
      SONG_THEME: ${{ inputs.theme }}
      SONG_MOOD: ${{ inputs.mood }}
      SONG_LANGUAGE: ${{ inputs.language }}
      VIDEO_STYLE: ${{ inputs.video_style }}
      SONG_DURATION_MIN: ${{ inputs.duration }}
      YOUTUBE_UPLOAD: ${{ inputs.upload_youtube }}
      YOUTUBE_PRIVACY: ${{ inputs.youtube_privacy }}
      ACESTEP_URL: http://127.0.0.1:8001
      ACESTEP_OFFLOAD_TO_CPU: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check tools
        run: |
          python3 --version
          ffmpeg -version | head -n 1
          nvidia-smi

      - name: Install uv
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          uv --version

      - name: Install ACE-Step 1.5
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          rm -rf vendor/ACE-Step-1.5
          git clone --depth 1 https://github.com/ACE-Step/ACE-Step-1.5.git vendor/ACE-Step-1.5
          cd vendor/ACE-Step-1.5
          uv sync

      - name: Start local ACE-Step API
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd vendor/ACE-Step-1.5
          nohup uv run acestep-api --host 127.0.0.1 --port 8001 --init_service true --config_path acestep-v15-turbo --init_llm true --lm_model_path acestep-5Hz-lm-0.6B --download-source huggingface > "$GITHUB_WORKSPACE/acestep.log" 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8001/health >/dev/null 2>&1; then
              echo 'ACE-Step API is ready.'
              exit 0
            fi
            sleep 5
          done
          cat "$GITHUB_WORKSPACE/acestep.log"
          exit 1

      - name: Create Python environment
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-vision.txt

      - name: Generate lyrics and metadata
        run: |
          . .venv/bin/activate
          python scripts/generate_metadata.py

      - name: Generate full song with vocals
        run: |
          . .venv/bin/activate
          python scripts/generate_music.py

      - name: Generate AI visual scenes
        run: |
          . .venv/bin/activate
          python scripts/generate_scenes.py

      - name: Assemble music video
        run: |
          . .venv/bin/activate
          python scripts/assemble_video.py

      - name: Generate thumbnail
        run: |
          . .venv/bin/activate
          python scripts/generate_thumbnail.py

      - name: Upload to YouTube
        if: ${{ inputs.upload_youtube }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          . .venv/bin/activate
          python scripts/upload_youtube.py

      - name: Publish generated files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: afro-reggae-${{ inputs.song_title }}
          path: output/
          if-no-files-found: error
          retention-days: 7
