name: Create Afro-Reggae Song

on:
  workflow_dispatch:
    inputs:
      song_title:
        description: 'Song title'
        required: true
        default: 'Sweet Island Loving'
        type: string
      theme:
        description: 'Song theme/story'
        required: true
        default: 'Romantic island love under the African sunset'
        type: string
      mood:
        description: 'Mood'
        required: true
        default: 'Romantic, warm, uplifting'
        type: string
      language:
        description: 'Language'
        required: true
        default: 'English + Swahili'
        type: string
      video_style:
        description: 'Music-video visual style'
        required: true
        default: 'African tropical island, cinematic, romantic, realistic'
        type: string
      duration:
        description: 'Target duration in minutes'
        required: true
        default: '2'
        type: string
      upload_youtube:
        description: 'Upload to YouTube after generation'
        required: true
        default: false
        type: boolean
      youtube_privacy:
        description: 'YouTube visibility'
        required: true
        default: 'private'
        type: choice
        options:
          - private
          - unlisted
          - public

jobs:
  generate:
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read

    env:
      SONG_TITLE: ${{ inputs.song_title }}
      SONG_THEME: ${{ inputs.theme }}
      SONG_MOOD: ${{ inputs.mood }}
      SONG_LANGUAGE: ${{ inputs.language }}
      VIDEO_STYLE: ${{ inputs.video_style }}
      SONG_DURATION_MIN: ${{ inputs.duration }}
      YOUTUBE_UPLOAD: ${{ inputs.upload_youtube }}
      YOUTUBE_PRIVACY: ${{ inputs.youtube_privacy }}
      ACESTEP_BASE_URL: http://127.0.0.1:8001
      ACESTEP_MAX_SECONDS: '120'
      ACESTEP_TIMEOUT_SECONDS: '14400'
      CUDA_VISIBLE_DEVICES: '-1'
      HF_HUB_DISABLE_TELEMETRY: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        shell: powershell
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version | Select-Object -First 1

      - name: Prepare local ACE-Step
        shell: powershell
        run: .\scripts\setup_local_acestep.ps1

      - name: Start local ACE-Step API in CPU mode
        shell: powershell
        run: |
          $env:CUDA_VISIBLE_DEVICES='-1'
          $env:ACESTEP_LM_BACKEND='pt'
          $env:ACESTEP_INIT_LLM='true'
          $env:PYTHONUNBUFFERED='1'
          $ace = Join-Path $env:USERPROFILE 'ACE-Step-1.5'
          Start-Process powershell -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-Command',"Set-Location '$ace'; `$env:CUDA_VISIBLE_DEVICES='-1'; `$env:ACESTEP_LM_BACKEND='pt'; `$env:ACESTEP_INIT_LLM='true'; uv run acestep-api --host 127.0.0.1 --port 8001 --lm_backend pt" -WindowStyle Hidden
          $ready = $false
          for ($i=0; $i -lt 180; $i++) {
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:8001/health' -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ready = $true; break }
            } catch {}
            Start-Sleep -Seconds 5
          }
          if (-not $ready) { throw 'Local ACE-Step API did not become ready.' }
          Write-Host 'Local ACE-Step API is ready.'

      - name: Install pipeline Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate lyrics and metadata
        shell: powershell
        run: python scripts\generate_metadata.py

      - name: Generate full song locally with ACE-Step
        shell: powershell
        run: python scripts\generate_music.py

      - name: Generate music-video scenes
        shell: powershell
        run: python scripts\generate_scenes.py

      - name: Assemble music video
        shell: powershell
        run: python scripts\assemble_video.py

      - name: Generate thumbnail
        shell: powershell
        run: python scripts\generate_thumbnail.py

      - name: Upload to YouTube
        if: ${{ inputs.upload_youtube }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        shell: powershell
        run: python scripts\upload_youtube.py

      - name: Publish generated files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: afro-reggae-${{ inputs.song_title }}
          path: output/
          if-no-files-found: error
          retention-days: 7
